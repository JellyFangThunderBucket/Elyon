[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "elyon-observer"
version = "0.2.0"
description = "Evidence broker and explicitly scoped desktop browser validation host"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["mypy==1.18.2", "ruff==0.14.3", "build==1.3.0", "playwright==1.62.0"]

[project.scripts]
elyon = "elyon.cli:main"

[tool.setuptools.packages.find]
include = ["elyon*"]

[tool.mypy]
strict = true
packages = ["elyon"]

[tool.ruff]
extend-exclude = ["recovery"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"recovery/**" = ["ALL"]
