name: Verify source and recovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npm run check:themes
      - run: npm run format:check
      - run: python tools/check_recovery.py
      - run: python -m unittest discover -v
      - run: python -m mypy elyon
      - run: python -m ruff check .
      - run: python -m build
  browser-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      ELYON_CHROMIUM_EXECUTABLE: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: python -m playwright install --with-deps chromium
      - run: python tools/run_browser_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-results
          path: artifacts/browser-checks
